[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ouroboros"
version = "0.1.0"
description = "A small GPT built from scratch, plus a bounded loop where each generation designs and trains its successor"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["ouroboros"]

[tool.setuptools.package-data]
ouroboros = ["*.toml", "*.pt"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
